                $ref: '#/components/schemas/OrderItem'
    OrderRow:
      type: object
      description: Row `orders` hasil create/update; belum termasuk item.
      required:
        - id
        - user_id
        - total_amount
        - status
        - shipping_address
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: ID bigint pesanan.
          example: '57'
        user_id:
          type: string
          example: '1'
        total_amount:
          type: number
          example: 170000
        status:
          $ref: '#/components/schemas/OrderStatus'
        shipping_address:
          type: string
          example: Jl. Contoh No. 1, Jakarta Selatan 12345
        payment_proof_url:
          type: string
          nullable: true
          description: |
            Path file di private bucket pada respons upload dan webhook.
            Endpoint baca dan perubahan status admin mengembalikan signed URL.
          example: proof_57_1763374200000.jpg
        payment_submitted_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-11-17T10:15:00.000Z'
        created_at:
          type: string
          format: date-time
          example: '2026-11-17T10:10:00.000Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-11-17T10:20:00.000Z'
    OrderWebhookResult:
      allOf:
        - $ref: '#/components/schemas/OrderRow'
        - type: object
          required: [previous_status, already_processed]
          properties:
            previous_status:
              $ref: '#/components/schemas/OrderStatus'
            already_processed:
              type: boolean
              description: True bila status yang dikirim sama dengan status saat ini.
              example: false
    CheckoutRequest:
      type: object
      required: [shipping_address]
      properties:
        shipping_address:
          type: string
          minLength: 1
          maxLength: 1000
          example: Jl. Contoh No. 1, Jakarta Selatan 12345
    UploadProofRequest:
      type: object
      required: [proof_image]
      properties:
        proof_image:
          type: string
          format: binary
          description: |
            File gambar bukti transfer. Hanya JPEG, PNG, atau WebP, maksimal
            2 MB. Tipe sebenarnya dideteksi dari magic bytes dan harus cocok
            dengan `Content-Type`.
    WebhookRequest:
      type: object
      required:
        - order_id
        - status_code
        - transaction_status
        - gross_amount
        - signature_key
      properties:
        order_id:
          description: ID pesanan.
          oneOf:
            - type: string
              pattern: '^[1-9][0-9]*$'
            - type: integer
              minimum: 1
          example: '57'
        status_code:
          description: Wajib untuk perhitungan signature, walau tidak mengubah status.
          oneOf:
            - type: string
            - type: integer
          example: '200'
        transaction_status:
          type: string
          description: Status dari payment gateway (case-insensitive).
          enum:
            - capture
            - settlement
            - success
            - paid
            - pending
            - cancel
            - deny
            - expire
            - failure
            - failed
          example: settlement
        gross_amount:
          description: Nominal pembayaran; harus sama dengan total_amount pesanan.
          oneOf:
            - type: string
              pattern: '^[0-9]+(\.[0-9]+)?$'
            - type: number
          example: '170000'
        signature_key:
          type: string
          pattern: '^[a-f0-9]{128}$'
          description: |
            Hash SHA-512 (hex, 128 karakter) dari
            `order_id + status_code + gross_amount + PAYMENT_SERVER_KEY`.
            Bukan HMAC dan bukan token bearer.
          example: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    CheckoutEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/OrderRow'
    OrderListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
