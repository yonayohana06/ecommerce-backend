openapi: 3.0.3
info:
  title: FastShop API
  version: 1.0.0
  description: |
    Kontrak HTTP untuk backend FastShop.

    - Base URL lokal: `http://localhost:3001`.
    - Endpoint user memakai header `Authorization: Bearer <user-jwt>`.
    - Endpoint admin memakai header `Authorization: Bearer <admin-jwt>`.
    - Refresh token dikirim lewat cookie HttpOnly dan tidak pernah muncul di body.
    - Endpoint refresh/logout berbasis cookie wajib mengirim header `Origin` yang
      terdaftar di allowlist CORS.
    - Error selalu memakai bentuk `{ "code": <status>, "message": "<pesan>" }`.
    - ID kolom PostgreSQL `bigint` dikirim sebagai JSON string; ID `serial`/`integer`
      dikirim sebagai JSON number.
    - Harga dan total dikirim sebagai JSON number (Rupiah).
servers:
  - url: http://localhost:3001
    description: Local development
tags:
  - name: System
    description: Liveness dan readiness.
  - name: Auth
    description: Registrasi dan login pelanggan.
  - name: Admin Auth
    description: Login dan profil administrator.
  - name: Products
    description: Katalog produk publik.
  - name: Categories
    description: Katalog kategori publik.
  - name: Admin Products
    description: Manajemen produk untuk administrator.
  - name: Admin Categories
    description: Manajemen kategori untuk administrator.
  - name: Admin Orders
    description: Monitoring dan perubahan status pesanan.
  - name: Admin Audit Logs
    description: Riwayat aksi administratif.
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness check
      description: Memastikan proses server hidup tanpa menyentuh database.
      responses:
        '200':
          description: Proses hidup.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
        '500':
          $ref: '#/components/responses/InternalServerError'
  /200:
    get:
      tags: [System]
      operationId: getHealthAlias
      summary: Alias liveness check
      description: Alias lama `/health` untuk kompatibilitas monitoring.
      responses:
        '200':
          description: Proses hidup.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
        '500':
          $ref: '#/components/responses/InternalServerError'
  /ready:
    get:
      tags: [System]
      operationId: getReadiness
      summary: Readiness check
      description: Menjalankan `SELECT 1` ke database utama.
      responses:
        '200':
          description: Database siap.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              example:
                status: ready
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Registrasi pelanggan
      description: Membuat akun pelanggan dengan role `user`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: Budi Santoso
              email: budi@example.com
              password: Password123
      responses:
        '201':
          description: Registrasi berhasil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterEnvelope'
              example:
                code: 201
                message: Registrasi akun berhasil
                data:
                  id: '1'
                  name: Budi Santoso
                  email: budi@example.com
                  role: user
                  created_at: '2026-11-17T10:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      summary: Login pelanggan
      description: |
        Menghasilkan access token user (default berlaku 15 menit) dan refresh
        token 30 hari lewat cookie HttpOnly `fastshop_user_refresh`. Refresh
        token tidak pernah dikirim di body. Kredensial salah, akun admin, dan
        email tidak dikenal semuanya menghasilkan pesan generik `401` agar role
        akun tidak dapat dienumerasi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: budi@example.com
              password: Password123
      responses:
        '200':
          description: Login berhasil.
          headers:
            Set-Cookie:
              description: |
                Refresh token pelanggan. HttpOnly; `Secure` dan `SameSite=None`
                di produksi, `SameSite=Lax` di non-produksi.
              schema:
                type: string
              example: fastshop_user_refresh=refresh-token-placeholder; Path=/api/auth; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEnvelope'
              example:
                code: 200
                message: Login berhasil
                data:
                  user:
                    id: '1'
                    name: Budi Santoso
                    email: budi@example.com
                    role: user
                  token: user-token-placeholder
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshUserToken
      summary: Perbarui access token pelanggan
      description: |
        Memutar refresh token dari cookie HttpOnly `fastshop_user_refresh`.
        Token lama dicabut dan diganti token baru; access token baru dikirim di
        body, sedangkan refresh token hanya lewat `Set-Cookie`. Origin wajib
        terdaftar di allowlist CORS.
      security:
        - userRefreshCookie: []
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      responses:
        '200':
          description: Token berhasil diperbarui.
          headers:
            Set-Cookie:
              description: Refresh token baru, HttpOnly.
              schema:
                type: string
              example: fastshop_user_refresh=refresh-token-baru; Path=/api/auth; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshEnvelope'
              example:
                code: 200
                message: Token berhasil diperbarui
                data:
                  token: user-token-placeholder
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logoutUser
      summary: Logout pelanggan
      description: |
        Mencabut refresh token family dari cookie dan selalu menghapus cookie,
        termasuk bila cookie tidak ada atau token tidak dikenal (idempoten).
        Access token tetap berlaku sampai TTL pendeknya habis.
      security:
        - userRefreshCookie: []
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      responses:
        '200':
          description: Logout berhasil.
          headers:
            Set-Cookie:
              description: Menghapus cookie refresh pelanggan.
              schema:
                type: string
              example: fastshop_user_refresh=; Path=/api/auth; Expires=Thu, 01 Jan 1970 00:00:00 GMT; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                code: 200
                message: Logout berhasil
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/password:
    put:
      tags: [Auth]
      operationId: changeUserPassword
      summary: Ubah password pelanggan
      description: |
        Memvalidasi password saat ini, lalu menaikkan `token_version` dan
        mencabut seluruh refresh token user. Access token lama langsung ditolak;
        cookie refresh dihapus sehingga user harus login ulang.
      security:
        - userBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              current_password: Password123
              new_password: PasswordBaru456
      responses:
        '200':
          description: Password berhasil diubah.
          headers:
            Set-Cookie:
              description: Menghapus cookie refresh pelanggan.
              schema:
                type: string
              example: fastshop_user_refresh=; Path=/api/auth; Expires=Thu, 01 Jan 1970 00:00:00 GMT; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                code: 200
                message: Password berhasil diubah. Silakan login ulang.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getUserProfile
      summary: Profil pelanggan
      security:
        - userBearer: []
      responses:
        '200':
          description: Profil pelanggan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
              example:
                code: 200
                message: Berhasil mengambil profil pengguna
                data:
                  id: '1'
                  name: Budi Santoso
                  email: budi@example.com
                  phone_number: null
                  role: user
                  created_at: '2026-11-17T10:00:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/admin/auth/login:
    post:
      tags: [Admin Auth]
      operationId: loginAdmin
      summary: Login administrator
      description: |
        Menghasilkan access token admin (default berlaku 30 menit) dan refresh
        token 8 jam lewat cookie HttpOnly `fastshop_admin_refresh`. Refresh
        token tidak pernah dikirim di body. Hanya akun dengan role `admin` yang
        dapat login; kegagalan memakai pesan generik `401`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: admin@example.com
              password: AdminPassword123
      responses:
        '200':
          description: Login admin berhasil.
          headers:
            Set-Cookie:
              description: |
                Refresh token administrator. HttpOnly; `Secure` dan
                `SameSite=None` di produksi, `SameSite=Lax` di non-produksi.
              schema:
                type: string
              example: fastshop_admin_refresh=refresh-token-placeholder; Path=/api/admin/auth; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuthEnvelope'
              example:
                code: 200
                message: Login admin berhasil
                data:
                  admin:
                    id: '2'
                    name: Administrator
                    email: admin@example.com
                    role: admin
                  token: admin-token-placeholder
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/admin/auth/refresh:
    post:
      tags: [Admin Auth]
      operationId: refreshAdminToken
      summary: Perbarui access token administrator
      description: |
        Memutar refresh token dari cookie HttpOnly `fastshop_admin_refresh`.
        Token lama dicabut dan diganti token baru; access token baru dikirim di
        body, sedangkan refresh token hanya lewat `Set-Cookie`. Origin wajib
        terdaftar di allowlist CORS.
      security:
        - adminRefreshCookie: []
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      responses:
        '200':
          description: Token admin berhasil diperbarui.
          headers:
            Set-Cookie:
              description: Refresh token admin baru, HttpOnly.
              schema:
                type: string
              example: fastshop_admin_refresh=refresh-token-baru; Path=/api/admin/auth; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshEnvelope'
              example:
                code: 200
                message: Token berhasil diperbarui
                data:
                  token: admin-token-placeholder
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/admin/auth/logout:
    post:
      tags: [Admin Auth]
      operationId: logoutAdmin
      summary: Logout administrator
      description: |
        Mencabut refresh token family admin dari cookie dan selalu menghapus
        cookie, termasuk bila cookie tidak ada atau token tidak dikenal
        (idempoten). Access token tetap berlaku sampai TTL pendeknya habis.
      security:
        - adminRefreshCookie: []
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      responses:
        '200':
          description: Logout admin berhasil.
          headers:
            Set-Cookie:
              description: Menghapus cookie refresh administrator.
              schema:
                type: string
              example: fastshop_admin_refresh=; Path=/api/admin/auth; Expires=Thu, 01 Jan 1970 00:00:00 GMT; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                code: 200
                message: Logout berhasil
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/admin/auth/password:
    put:
      tags: [Admin Auth]
      operationId: changeAdminPassword
      summary: Ubah password administrator
      description: |
        Memvalidasi password saat ini, lalu menaikkan `token_version` dan
        mencabut seluruh refresh token admin. Access token lama langsung
        ditolak; cookie refresh dihapus sehingga admin harus login ulang.
      security:
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              current_password: AdminPassword123
              new_password: AdminPassword456
      responses:
        '200':
          description: Password admin berhasil diubah.
          headers:
            Set-Cookie:
              description: Menghapus cookie refresh administrator.
              schema:
                type: string
              example: fastshop_admin_refresh=; Path=/api/admin/auth; Expires=Thu, 01 Jan 1970 00:00:00 GMT; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                code: 200
                message: Password berhasil diubah. Silakan login ulang.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/admin/auth/me:
    get:
      tags: [Admin Auth]
      operationId: getAdminProfile
      summary: Profil administrator
      security:
        - adminBearer: []
      responses:
        '200':
          description: Profil administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
              example:
                code: 200
                message: Berhasil mengambil profil administrator
                data:
                  id: '2'
                  name: Administrator
                  email: admin@example.com
                  phone_number: null
                  role: admin
                  created_at: '2026-11-17T10:00:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: Daftar produk aktif
      parameters:
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/ProductSearch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Daftar produk aktif.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListEnvelope'
              example:
                code: 200
                message: Berhasil mengambil daftar produk
                data:
                  - id: '12'
                    name: Kopi Arabica
                    price: 85000
                    stock: 20
                    image_url: https://example.com/kopi.jpg
                    category_name: Minuman
                pagination:
                  currentPage: 1
                  limit: 10
                  totalItems: 1
                  totalPages: 1
                  hasPreviousPage: false
                  hasNextPage: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/products/{id}:
    get:
      tags: [Products]
      operationId: getProductDetail
      summary: Detail produk aktif
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Detail produk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailEnvelope'
              example:
                code: 200
                message: Berhasil mengambil detail produk
                data:
                  id: '12'
                  name: Kopi Arabica
                  description: Biji kopi arabica premium.
                  price: 85000
                  stock: 20
                  image_url: https://example.com/kopi.jpg
                  category_id: 1
                  category_name: Minuman
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: Daftar kategori
      parameters:
        - $ref: '#/components/parameters/CategorySearch'
      responses:
        '200':
          description: Daftar kategori beserta jumlah produk aktif.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListEnvelope'
              example:
                code: 200
                message: Berhasil mengambil daftar kategori
                data:
                  - id: 1
                    name: Minuman
                    slug: minuman
                    icon_url: https://example.com/icons/minuman.png
                    created_at: '2026-11-17T10:00:00.000Z'
                    product_count: 3
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/categories/slug/{slug}:
    get:
      tags: [Categories]
      operationId: getCategoryBySlug
      summary: Detail kategori berdasarkan slug
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Detail kategori.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryDetailEnvelope'
              example:
                code: 200
                message: Berhasil mengambil detail kategori
                data:
                  id: 1
                  name: Minuman
                  slug: minuman
                  icon_url: https://example.com/icons/minuman.png
                  created_at: '2026-11-17T10:00:00.000Z'
                  product_count: 3
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/categories/{id}:
    get:
      tags: [Categories]
      operationId: getCategoryDetail
      summary: Detail kategori berdasarkan ID
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Detail kategori.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryDetailEnvelope'
              example:
                code: 200
                message: Berhasil mengambil detail kategori
                data:
                  id: 1
                  name: Minuman
                  slug: minuman
                  icon_url: https://example.com/icons/minuman.png
                  created_at: '2026-11-17T10:00:00.000Z'
                  product_count: 3
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/cart:
    get:
      tags: [Cart]
      operationId: getCart
      summary: Isi keranjang user
      description: |
        Mengembalikan seluruh item keranjang milik user yang login.
        Item dari produk nonaktif tetap tampil dengan `is_available: false`
        agar dapat dihapus, tetapi tidak dihitung ke `grand_total`.
      security:
        - userBearer: []
      responses:
        '200':
          description: Isi keranjang.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartEnvelope'
              example:
                code: 200
                message: Berhasil mengambil data keranjang
                data:
                  items:
                    - cart_item_id: 5
                      product_id: '12'
                      product_name: Kopi Arabica
                      price: 85000
                      image_url: https://example.com/kopi.jpg
                      quantity: 2
                      stock: 20
                      is_active: true
                      is_available: true
                      subtotal: 170000
                  grand_total: 170000
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Cart]
      operationId: addCartItem
      summary: Tambah produk ke keranjang
      description: |
        Menambahkan produk aktif ke keranjang. Jika produk sudah ada, quantity
        dijumlahkan. Total quantity tidak boleh melebihi stok. Respons memakai
        row `cart_items` mentah (`id`, `user_id`, `product_id`, `quantity`,
        `created_at`, `updated_at`), bukan objek CartItem.
      security:
        - userBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartRequest'
            example:
              product_id: 12
              quantity: 2
      responses:
        '200':
          description: Item berhasil ditambahkan atau quantity diperbarui.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItemRowEnvelope'
              example:
                code: 200
                message: Berhasil menambahkan produk ke keranjang
                data:
                  id: 5
                  user_id: '1'
                  product_id: '12'
                  quantity: 2
                  created_at: '2026-11-17T10:00:00.000Z'
                  updated_at: '2026-11-17T10:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Cart]
      operationId: clearCart
      summary: Kosongkan keranjang
      description: Menghapus seluruh item keranjang milik user yang login.
      security:
        - userBearer: []
      responses:
        '200':
