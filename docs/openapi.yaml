  responses:
    InvalidSignature:
      description: Signature webhook tidak valid atau tidak cocok.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 403
            message: 'Forbidden: Invalid signature key'
    BadRequest:
      description: Request tidak valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 400
            message: Input tidak valid.
    Unauthorized:
      description: Token tidak ada, tidak valid, atau sudah kedaluwarsa.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 401
            message: Token tidak valid atau sudah kedaluwarsa.
    Forbidden:
      description: Token valid tetapi role/type tidak sesuai.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 403
            message: Akses dilarang.
    NotFound:
      description: Resource tidak ditemukan.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 404
            message: Resource tidak ditemukan.
    Conflict:
      description: Data melanggar constraint keunikan.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 409
            message: Data sudah terdaftar.
    TooManyRequests:
      description: Melewati batas rate limit.
      headers:
        Retry-After:
          description: Detik sampai permintaan boleh dicoba lagi.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 429
            message: Terlalu banyak permintaan. Silakan coba lagi nanti.
    InternalServerError:
      description: Kesalahan server yang tidak terduga.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 500
            message: Terjadi kesalahan pada server.
    ServiceUnavailable:
      description: Dependency belum siap.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 503
            message: Database belum siap.
