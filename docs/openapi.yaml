  /api/orders/webhook/payment:
    post:
      tags: [Orders]
      operationId: handlePaymentWebhook
      summary: Webhook status pembayaran
      description: |
        Callback dari payment gateway. Tidak memakai bearer token; autentikasi
        memakai `signature_key` berupa hash **SHA-512** (bukan HMAC) dari
        `order_id + status_code + gross_amount + PAYMENT_SERVER_KEY`.
        `status_code` wajib dikirim walau tidak dipakai untuk mengubah status.
        Status yang sama dengan status saat ini bersifat idempotent dan
        dikembalikan dengan `already_processed: true`. Nominal `gross_amount`
        harus sama dengan `total_amount` pesanan.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookRequest'
            example:
              order_id: '57'
              status_code: '200'
              transaction_status: settlement
              gross_amount: '170000'
              signature_key: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      responses:
        '200':
          description: Status pembayaran diproses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEnvelope'
              example:
                code: 200
                message: Status pembayaran berhasil diproses
                data:
                  id: '57'
                  user_id: '1'
                  total_amount: 170000
                  status: PAID
                  shipping_address: Jl. Contoh No. 1, Jakarta Selatan 12345
                  payment_proof_url: proof_57_1763374200000.jpg
                  payment_submitted_at: '2026-11-17T10:15:00.000Z'
                  created_at: '2026-11-17T10:10:00.000Z'
                  updated_at: '2026-11-17T10:20:00.000Z'
                  previous_status: PROCESSING
                  already_processed: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/InvalidSignature'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
