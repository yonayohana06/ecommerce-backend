        (`category_id: null`). `affected_products_count` melaporkan jumlah
        produk yang terdampak. Aksi dicatat sebagai `category.delete`.
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Kategori dihapus.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryDeleteEnvelope'
              example:
                code: 200
                message: Kategori berhasil dihapus. 3 produk terkait kini menjadi tanpa kategori.
                data:
                  category:
                    id: 1
                    name: Minuman
                    slug: minuman
                    icon_url: https://example.com/icons/minuman.png
                    created_at: '2026-11-17T10:00:00.000Z'
                  affected_products_count: 3
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/admin/orders/summary:
    get:
      tags: [Admin Orders]
      operationId: adminGetOrderSummary
      summary: Ringkasan statistik pesanan
      description: |
        Total pesanan, total omset dari status `PAID`/`SHIPPED`/`COMPLETED`,
        dan jumlah pesanan per status.
      security:
        - adminBearer: []
      responses:
        '200':
          description: Ringkasan pesanan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderStatsEnvelope'
              example:
                code: 200
                message: Berhasil mengambil ringkasan statistik pesanan
                data:
                  totalOrders: 42
                  totalRevenue: 3570000
                  ordersByStatus:
                    PENDING: 10
                    PROCESSING: 4
                    PAID: 8
                    SHIPPED: 6
                    COMPLETED: 9
                    CANCELLED: 3
                    FAILED: 2
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/admin/orders:
    get:
      tags: [Admin Orders]
      operationId: adminListOrders
      summary: Daftar pesanan (admin)
      description: |
        Daftar seluruh pesanan beserta email dan nama user. `search` mencocokkan
        ID pesanan atau email. `payment_proof_url` berupa signed URL bila ada.
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/OrderStatusFilter'
        - $ref: '#/components/parameters/AdminOrderSearch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Daftar pesanan admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrderListEnvelope'
              example:
                code: 200
                message: Berhasil mengambil daftar pesanan admin
                data:
                  - order_id: '57'
                    user_id: '1'
                    email: budi@example.com
                    user_name: Budi Santoso
                    total_amount: 170000
                    status: PENDING
                    shipping_address: Jl. Contoh No. 1, Jakarta Selatan 12345
                    payment_proof_url: null
                    payment_submitted_at: null
                    created_at: '2026-11-17T10:10:00.000Z'
                    updated_at: '2026-11-17T10:10:00.000Z'
                pagination:
                  currentPage: 1
                  limit: 10
                  totalItems: 1
                  totalPages: 1
                  hasPreviousPage: false
                  hasNextPage: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/admin/orders/{orderId}:
    get:
      tags: [Admin Orders]
      operationId: adminGetOrderDetail
      summary: Detail pesanan (admin)
      description: |
        Detail pesanan beserta data user dan item. `payment_proof_url` berupa
        signed URL bila ada.
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Detail pesanan admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrderDetailEnvelope'
              example:
                code: 200
                message: Berhasil mengambil detail pesanan
                data:
                  id: '57'
                  user_id: '1'
                  email: budi@example.com
                  user_name: Budi Santoso
                  phone_number: null
                  total_amount: 170000
                  status: PENDING
                  shipping_address: Jl. Contoh No. 1, Jakarta Selatan 12345
                  payment_proof_url: null
                  payment_submitted_at: null
                  created_at: '2026-11-17T10:10:00.000Z'
                  updated_at: '2026-11-17T10:10:00.000Z'
                  items:
                    - order_item_id: '101'
                      product_id: '12'
                      product_name: Kopi Arabica
                      product_image: https://example.com/kopi.jpg
                      quantity: 2
                      price_at_purchase: 85000
                      subtotal: 170000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/admin/orders/{orderId}/status:
    patch:
      tags: [Admin Orders]
      operationId: adminUpdateOrderStatus
      summary: Ubah status pesanan
      description: |
        Transisi yang diizinkan:
        `PENDING → PROCESSING/PAID/CANCELLED/FAILED`,
        `PROCESSING → PAID/CANCELLED/FAILED`,
        `PAID → SHIPPED`, `SHIPPED → COMPLETED`, dan
        `CANCELLED/FAILED → PAID` (stok dipotong kembali).
        Transisi lain ditolak `400`. Status yang sama tidak mengubah apa pun.
        Pembatalan mengembalikan stok. Aksi yang benar-benar mengubah status
        dicatat sebagai `order.status.update`. `payment_proof_url` pada respons
        berupa signed URL bila ada.
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusUpdateRequest'
            example:
              status: PAID
      responses:
        '200':
          description: Status pesanan diperbarui.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRowEnvelope'
              example:
                code: 200
                message: Status pesanan berhasil diubah menjadi 'PAID'
                data:
                  id: '57'
                  user_id: '1'
                  total_amount: 170000
                  status: PAID
                  shipping_address: Jl. Contoh No. 1, Jakarta Selatan 12345
                  payment_proof_url: proof_57_1763374200000.jpg
                  payment_submitted_at: '2026-11-17T10:15:00.000Z'
                  created_at: '2026-11-17T10:10:00.000Z'
                  updated_at: '2026-11-17T10:25:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/admin/audit-logs:
    get:
      tags: [Admin Audit Logs]
      operationId: adminListAuditLogs
      summary: Daftar audit log
      description: |
        Riwayat aksi administratif, terbaru lebih dulu. Filter opsional:
        `entity_type`, `action`, dan `actor_id`. Aksi yang dicatat antara lain
        `product.create/update/delete`, `category.create/update/delete`, dan
        `order.status.update`.
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/EntityTypeFilter'
        - $ref: '#/components/parameters/AuditActionFilter'
        - $ref: '#/components/parameters/ActorIdFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Daftar audit log.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListEnvelope'
              example:
                code: 200
                message: Berhasil mengambil audit log
                data:
                  - id: '9001'
                    actor_id: '2'
                    actor_email: admin@example.com
                    action: product.update
                    entity_type: product
                    entity_id: '12'
                    before_data:
                      price: 85000
                    after_data:
                      price: 90000
                    ip_address: 127.0.0.1
                    created_at: '2026-11-17T11:30:00.000Z'
                pagination:
                  currentPage: 1
                  limit: 10
                  totalItems: 1
                  totalPages: 1
                  hasPreviousPage: false
                  hasNextPage: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT pelanggan yang ditandatangani dengan `JWT_SECRET`.
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT administrator yang ditandatangani dengan `ADMIN_JWT_SECRET`.
    userRefreshCookie:
      type: apiKey
      in: cookie
      name: fastshop_user_refresh
      description: |
        Refresh token pelanggan berupa string opaque. Disimpan sebagai hash
        SHA-256 di database, HttpOnly, dan hanya berlaku pada path `/api/auth`.
    adminRefreshCookie:
      type: apiKey
      in: cookie
      name: fastshop_admin_refresh
      description: |
        Refresh token administrator berupa string opaque. Disimpan sebagai hash
        SHA-256 di database, HttpOnly, dan hanya berlaku pada path
        `/api/admin/auth`.
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Halaman yang diminta (mulai 1).
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Jumlah item per halaman (maksimal 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    Id:
      name: id
      in: path
      required: true
      description: ID numerik.
      schema:
        type: integer
        format: int64
        minimum: 1
    Slug:
      name: slug
      in: path
      required: true
      description: Slug kategori yang ramah URL.
      schema:
        type: string
        minLength: 1
        maxLength: 100
    CategoryId:
      name: category_id
      in: query
      required: false
      description: Filter produk berdasarkan ID kategori.
      schema:
        type: integer
        minimum: 1
    ProductSearch:
      name: search
      in: query
      required: false
      description: Pencarian nama produk (case-insensitive).
      schema:
        type: string
        maxLength: 100
    CategorySearch:
      name: search
      in: query
      required: false
      description: Pencarian nama kategori (case-insensitive).
      schema:
        type: string
        maxLength: 100
    CartItemId:
      name: id
      in: path
      required: true
      description: ID item keranjang (`cart_items.id`, integer).
      schema:
        type: integer
        minimum: 1
    OrderId:
      name: orderId
      in: path
      required: true
      description: ID pesanan (`orders.id`, bigint).
      schema:
        type: string
        pattern: '^[1-9][0-9]*$'
        example: '57'
    OrderStatusFilter:
      name: status
      in: query
      required: false
      description: Filter pesanan berdasarkan status.
      schema:
        $ref: '#/components/schemas/OrderStatus'
    AdminOrderSearch:
      name: search
      in: query
      required: false
      description: Pencarian berdasarkan ID pesanan atau email user.
      schema:
        type: string
        maxLength: 150
    EntityTypeFilter:
      name: entity_type
      in: query
      required: false
      description: Filter berdasarkan tipe entitas (mis. `product`, `category`, `order`).
      schema:
        type: string
        maxLength: 50
    AuditActionFilter:
      name: action
      in: query
      required: false
      description: Filter berdasarkan nama aksi (mis. `product.update`).
      schema:
        type: string
        maxLength: 100
    ActorIdFilter:
      name: actor_id
      in: query
      required: false
      description: Filter berdasarkan ID administrator yang melakukan aksi.
      schema:
        type: integer
        minimum: 1
    OriginHeader:
      name: Origin
      in: header
      required: true
      description: |
        Origin browser yang wajib terdaftar di allowlist CORS pada
        `src/config/origins.js`. Melindungi endpoint berbasis cookie dari CSRF.
      schema:
        type: string
        format: uri
      example: http://localhost:5173
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          example: 400
        message:
          type: string
          example: Input tidak valid.
    SuccessResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    ReadyResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ready
    Pagination:
      type: object
      required:
        - currentPage
        - limit
        - totalItems
        - totalPages
        - hasPreviousPage
        - hasNextPage
      properties:
        currentPage:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        totalItems:
          type: integer
          example: 42
        totalPages:
          type: integer
          example: 5
        hasPreviousPage:
          type: boolean
          example: false
        hasNextPage:
          type: boolean
          example: true
    UserSummary:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: string
          description: ID bigint dari PostgreSQL.
          example: '1'
        name:
          type: string
          example: Budi Santoso
        email:
          type: string
          format: email
          example: budi@example.com
        role:
          type: string
          enum: [user, admin]
          example: user
    User:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          required: [created_at]
          properties:
            phone_number:
              type: string
              nullable: true
              example: null
            created_at:
              type: string
              format: date-time
              example: '2026-11-17T10:00:00.000Z'
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Budi Santoso
        email:
          type: string
          format: email
          maxLength: 150
          example: budi@example.com
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: Minimal 8 karakter, maksimal 72 byte, serta mengandung huruf dan angka.
          example: Password123
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 150
          example: budi@example.com
        password:
          type: string
          example: Password123
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
          description: Password yang sedang aktif.
          example: Password123
        new_password:
          type: string
          minLength: 8
          maxLength: 72
          description: |
            Minimal 8 karakter, maksimal 72 byte, serta mengandung huruf dan
            angka. Harus berbeda dari password saat ini.
          example: PasswordBaru456
    RefreshEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: |
                    Access token baru. Refresh token baru hanya dikirim lewat
                    header `Set-Cookie`.
                  example: user-token-placeholder
    AuthEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [user, token]
              properties:
                user:
                  $ref: '#/components/schemas/UserSummary'
                token:
                  type: string
                  description: JWT user; default berlaku 15 menit.
                  example: user-token-placeholder
    AdminAuthEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [admin, token]
              properties:
                admin:
                  $ref: '#/components/schemas/UserSummary'
                token:
                  type: string
                  description: JWT admin; default berlaku 30 menit.
                  example: admin-token-placeholder
    UserEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/User'
    RegisterEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/User'
    ProductSummary:
      type: object
      required: [id, name, price, stock]
      properties:
        id:
          type: string
          description: ID bigint produk.
          example: '12'
        name:
          type: string
          example: Kopi Arabica
        price:
          type: number
          description: Harga dalam Rupiah.
          example: 85000
        stock:
          type: integer
          example: 20
        image_url:
          type: string
          nullable: true
          example: https://example.com/kopi.jpg
        category_name:
          type: string
          nullable: true
          example: Minuman
    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductSummary'
        - type: object
          properties:
            description:
              type: string
              nullable: true
              example: Biji kopi arabica premium.
            category_id:
              type: integer
              nullable: true
              example: 1
    AdminProductSummary:
      allOf:
        - $ref: '#/components/schemas/ProductSummary'
        - type: object
          required: [is_active]
          properties:
            is_active:
              type: boolean
              example: true
    AdminProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductDetail'
        - type: object
          required: [is_active]
          properties:
            is_active:
              type: boolean
              example: true
    Category:
      type: object
      required: [id, name, slug, created_at, product_count]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Minuman
        slug:
          type: string
          example: minuman
        icon_url:
          type: string
          nullable: true
          example: https://example.com/icons/minuman.png
        created_at:
          type: string
          format: date-time
          example: '2026-11-17T10:00:00.000Z'
        product_count:
          type: integer
          description: Jumlah produk aktif dalam kategori.
          example: 3
    ProductListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required: [data, pagination]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ProductSummary'
            pagination:
              $ref: '#/components/schemas/Pagination'
    ProductDetailEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/ProductDetail'
    CategoryListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Category'
    CategoryDetailEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Category'
    OrderStatus:
      type: string
      enum: [PENDING, PAID, PROCESSING, SHIPPED, COMPLETED, CANCELLED, FAILED]
      example: PENDING
    CartItem:
      type: object
      required:
        - cart_item_id
        - product_id
        - product_name
        - price
        - quantity
        - stock
        - is_active
        - is_available
        - subtotal
      properties:
        cart_item_id:
          type: integer
          description: ID baris `cart_items`.
          example: 5
        product_id:
          type: string
          description: ID bigint produk.
          example: '12'
        product_name:
          type: string
          example: Kopi Arabica
        price:
          type: number
          description: Harga satuan dalam Rupiah.
          example: 85000
        image_url:
          type: string
          nullable: true
          example: https://example.com/kopi.jpg
        quantity:
          type: integer
          example: 2
        stock:
          type: integer
          description: Stok produk saat ini.
          example: 20
        is_active:
          type: boolean
          description: Status aktif produk.
          example: true
        is_available:
          type: boolean
          description: True bila produk aktif dan stok mencukupi quantity keranjang.
          example: true
        subtotal:
          type: number
          description: price × quantity.
          example: 170000
    CartResponse:
      type: object
      required: [items, grand_total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        grand_total:
          type: number
          description: |
            Total hanya dari item dengan `is_available: true`. Item nonaktif
            atau stok kurang tetap ditampilkan tetapi tidak dihitung.
          example: 170000
    CartEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/CartResponse'
    CartItemRow:
      type: object
      description: Row `cart_items` mentah yang dikembalikan endpoint tambah/ubah.
      required:
        - id
        - user_id
        - product_id
        - quantity
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          example: 5
        user_id:
          type: string
          description: ID bigint user.
          example: '1'
        product_id:
          type: string
          description: ID bigint produk.
          example: '12'
        quantity:
          type: integer
          example: 2
        created_at:
          type: string
          format: date-time
          example: '2026-11-17T10:00:00.000Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-11-17T10:00:00.000Z'
    CartItemRowEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/CartItemRow'
    DeleteCartItemEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [id]
              properties:
                id:
                  type: integer
                  description: ID item keranjang yang dihapus.
                  example: 5
    ClearCartEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required: [data]
          properties:
            data:
