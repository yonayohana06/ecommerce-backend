          example: Jl. Contoh No. 1, Jakarta Selatan 12345
        payment_proof_url:
          type: string
          nullable: true
          description: Signed URL bukti pembayaran (berlaku terbatas).
          example: https://example.supabase.co/storage/v1/object/sign/payment-proofs/proof_57.jpg
        payment_submitted_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-11-17T10:15:00.000Z'
        created_at:
          type: string
          format: date-time
          example: '2026-11-17T10:10:00.000Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-11-17T10:20:00.000Z'
        total_items:
          type: integer
          example: 1
        total_quantity:
          type: integer
          example: 2
        items:
